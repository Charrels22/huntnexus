name: HuntNexus Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/app/**"
      - "tests/session-parser-contract.mjs"
      - "tests/fe36-damage-misc-contract.mjs"
      - "tests/fe37-session-integrity-contract.mjs"
      - "tests/fe39-hunt-evidence-contract.mjs"
      - "web/app/src/lib/hunt-evidence.ts"
      - "tests/fe32-session-import-regressions.mjs"
      - "tests/fe34-reparse-review-regressions.mjs"
      - "tests/fe28-client-id-regression.mjs"
      - "tests/fe30-auth-isolation-regression.mjs"
      - "tests/topic05-auth-assurance-regression.mjs"
      - "tests/topic05-auth-contract.mjs"
      - "web/app/src/lib/auth-security.ts"
      - "tests/fe22-online-original-analyzer-excerpts.mjs"
      - "tests/fixtures/fe22-online-original-analyzer-excerpts.json"
      - "tests/five-vocation-real-source-reconstruction.mjs"
      - "tests/fixtures/reconstructed-source-sessions-2026-10-11.json"
      - ".github/workflows/huntnexus-web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and typecheck
        run: npm run build

      - name: FE-28 browser guest UUID authorization scope regression
        run: node --experimental-strip-types ../../tests/fe28-client-id-regression.mjs

      - name: FE-30 account-bound scope isolation regression
        run: node --experimental-strip-types ../../tests/fe30-auth-isolation-regression.mjs

      - name: Topic 5 strong-auth assurance and session contract
        run: |
          node --experimental-strip-types ../../tests/topic05-auth-assurance-regression.mjs
          node ../../tests/topic05-auth-contract.mjs

      - name: Session Parser synthetic regression
        run: node --experimental-strip-types ../../tests/session-parser-contract.mjs

      - name: FE-36 Damage Input and Misc observed-vs-unobserved regression
        run: node --experimental-strip-types ../../tests/fe36-damage-misc-contract.mjs

      - name: FE-37 session block completeness and stored/history consistency
        run: node --experimental-strip-types ../../tests/fe37-session-integrity-contract.mjs

      - name: FE-39 source provenance and coverage semantics
        run: node --experimental-strip-types ../../tests/fe39-hunt-evidence-contract.mjs

      - name: FE-32 duration and canonical loot sprite regression
        run: node --experimental-strip-types ../../tests/fe32-session-import-regressions.mjs

      - name: FE-34 private reparse diff, no-op and downgrade safety regression
        run: node --experimental-strip-types ../../tests/fe34-reparse-review-regressions.mjs

      - name: Tier C sourced five-vocation numeric reconstruction (not raw gameplay exports)
        run: node --experimental-strip-types ../../tests/five-vocation-real-source-reconstruction.mjs

      - name: Public original Hunt/Party Analyzer short excerpts (EK RP ED MS EM)
        run: node --experimental-strip-types ../../tests/fe22-online-original-analyzer-excerpts.mjs
