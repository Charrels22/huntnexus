name: HuntNexus Cross Vocation Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/cross-vocation-smoke.mjs"
      - "web/app/src/routes/api/huntnexus.ts"
      - "db/migrations/0145_product_readiness_and_hot_path_indexes.sql"
      - "db/migrations/0146_fix_product_readiness_hunt_scope.sql"
      - ".github/workflows/huntnexus-cross-vocation-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: EK RP ED MS EM public smoke
        run: node tests/cross-vocation-smoke.mjs
