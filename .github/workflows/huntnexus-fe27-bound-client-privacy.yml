name: HuntNexus FE-27 Bound Client Scope

on:
  workflow_dispatch:
    inputs:
      bound_client_id:
        description: UUID of an ephemeral synthetic client_id already bound in Supabase
        required: true
        type: string
permissions:
  contents: read

jobs:
  bound-client-negative-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HUNTNEXUS_BOUND_CANARY_ID: ${{ inputs.bound_client_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify forged and missing credentials cannot access bound scope
        run: node tests/fe27-bound-client-privacy-smoke.mjs
