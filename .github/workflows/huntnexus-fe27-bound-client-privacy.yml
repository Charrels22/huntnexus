name: HuntNexus FE-27 Bound Client Scope

on:
  workflow_dispatch:
    inputs:
      bound_client_id:
        description: UUID of an ephemeral synthetic client_id already bound in Supabase
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "tests/fe27-bound-client-privacy-smoke.mjs"
      - ".github/workflows/huntnexus-fe27-bound-client-privacy.yml"

permissions:
  contents: read

jobs:
  bound-client-negative-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HUNTNEXUS_BOUND_CANARY_ID: ${{ inputs.bound_client_id || '01b1a96e-b20b-42fc-bb54-c85a4a277946' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify forged and missing credentials cannot access bound scope
        run: node tests/fe27-bound-client-privacy-smoke.mjs
