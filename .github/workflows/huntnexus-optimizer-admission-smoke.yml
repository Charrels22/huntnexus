name: HuntNexus Optimizer Admission Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/optimizer-admission-smoke.mjs"
      - ".github/workflows/huntnexus-optimizer-admission-smoke.yml"

permissions:
  contents: read

jobs:
  optimizer-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Same-origin concurrency and non-expensive API
        run: node tests/optimizer-admission-smoke.mjs
