name: HuntNexus Account Security Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/account-security-smoke.mjs"
      - "web/app/src/routes/account.tsx"
      - "web/app/src/components/shell/app-shell.tsx"
      - "web/app/src/lib/account-session-guard.ts"
      - "tests/fe30-auth-isolation-regression.mjs"
      - "web/app/src/routes/api/huntnexus.ts"
      - "web/app/src/integrations/supabase/client.browser.ts"
      - "web/app/src/lib/api/huntnexus.ts"
      - "web/app/src/lib/client-id.ts"
      - ".github/workflows/huntnexus-account-security-smoke.yml"

permissions:
  contents: read

jobs:
  account-negative-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unauthenticated account actions must reject
        run: node tests/account-security-smoke.mjs
