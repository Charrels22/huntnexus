name: HuntNexus Full Optimizer Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/full-optimizer-smoke.mjs"
      - "db/migrations/0152_optimizer_selection_isolated_timeout.sql"
      - ".github/workflows/huntnexus-full-optimizer-smoke.yml"

permissions:
  contents: read

jobs:
  full-optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: EK700 full universal setup on live public API
        run: node tests/full-optimizer-smoke.mjs
