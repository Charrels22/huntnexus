name: HuntNexus Original Public Analyzer Source QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/app/tests/fe22-live-original-party-description.mjs"
      - "web/app/src/lib/session-parser.ts"
      - ".github/workflows/huntnexus-original-source-qa.yml"

permissions:
  contents: read

jobs:
  live-source-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: web/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Parse original published Party (EM participant) and Solo (ED) descriptions transiently
        run: node --experimental-strip-types tests/fe22-live-original-party-description.mjs
