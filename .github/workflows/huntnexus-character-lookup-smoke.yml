name: HuntNexus RubinOT Character Lookup Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/rubinot-character-lookup-smoke.mjs"
      - "web/app/src/routes/api/huntnexus.ts"
      - ".github/workflows/huntnexus-character-lookup-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: RubinOT public character lookup smoke
        run: node tests/rubinot-character-lookup-smoke.mjs
